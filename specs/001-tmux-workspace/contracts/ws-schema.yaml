$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:ws:workspace-schema:v1
title: ws workspace definition
type: object
required: [version, windows]
additionalProperties: false
properties:
  version:
    const: 1
  windows:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/window'
$defs:
  window:
    type: object
    required: [name, path]
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
      path:
        type: string
        minLength: 1
      command:
        type: string
        minLength: 1
      env:
        type: object
        propertyNames:
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        additionalProperties:
          type: string
      panes:
        type: array
        items:
          $ref: '#/$defs/pane'
  pane:
    type: object
    required: [pos]
    additionalProperties: false
    properties:
      pos:
        enum: [left, right, top, bottom]
      id:
        type: string
        minLength: 1
      path:
        type: string
        minLength: 1
      command:
        type: string
        minLength: 1
      env:
        type: object
        propertyNames:
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        additionalProperties:
          type: string
      panes:
        type: array
        items:
          $ref: '#/$defs/pane'
