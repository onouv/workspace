[package]
name = "ws"
version = "0.1.0"
edition = "2024"
default-run = "ws"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
yaml_serde = "0.10.7"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# Test-only fixture binaries: fake external commands that let process-level integration tests
# exercise the real `ws` binary without a real tmux server or terminal emulator.
[[bin]]
name = "fake-tmux"
path = "tests/fixtures/fake_tmux.rs"
test = false
doc = false

[[bin]]
name = "fake-launcher"
path = "tests/fixtures/fake_launcher.rs"
test = false
doc = false
